services:
  mcp-server:
    build: .
    container_name: mcp-server
    # Use the host network so the backend can reach the host's Ollama on 127.0.0.1.
    network_mode: host
    ports:
      - "8000:8000"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - mcp-server
