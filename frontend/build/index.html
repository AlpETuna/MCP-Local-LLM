<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MCP Local LLM Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b1021;
      --panel: rgba(255, 255, 255, 0.04);
      --panel-strong: rgba(15, 23, 42, 0.8);
      --accent: #6cf0c2;
      --accent-soft: #5dd8ff;
      --text: #f6fbff;
      --muted: #a0b5d8;
      --border: rgba(255, 255, 255, 0.08);
      --shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      --glow: 0 10px 40px rgba(108, 240, 194, 0.18);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Space Grotesk", "Inter", system-ui, -apple-system, sans-serif;
      background: radial-gradient(120% 80% at 10% 20%, rgba(92, 219, 255, 0.15), transparent 40%), radial-gradient(120% 90% at 90% 10%, rgba(108, 240, 194, 0.16), transparent 45%), linear-gradient(135deg, #0d1329 0%, #0a0f1f 60%, #080b17 100%);
      color: var(--text);
      min-height: 100vh;
    }
    .page {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 16px;
      padding: 18px;
      min-height: 100vh;
    }
    .sidebar {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.04) 0%, rgba(255, 255, 255, 0.02) 100%);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: var(--shadow);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      letter-spacing: 0.4px;
    }
    .brand .pulse {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 8px rgba(108, 240, 194, 0.12);
      animation: pulse 2.4s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 8px rgba(108, 240, 194, 0.12); }
      50% { box-shadow: 0 0 0 2px rgba(108, 240, 194, 0.18); }
      100% { box-shadow: 0 0 0 8px rgba(108, 240, 194, 0.12); }
    }
    .action {
      background: linear-gradient(135deg, var(--accent), var(--accent-soft));
      color: #051018;
      border: none;
      padding: 10px 12px;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
      box-shadow: var(--glow);
    }
    .action:hover { transform: translateY(-1px); }
    .action:active { transform: translateY(0); }
    .sidebar-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
      overflow: hidden;
    }
    .sidebar-label {
      text-transform: uppercase;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.8px;
    }
    #conversationList {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px;
      background: rgba(255, 255, 255, 0.02);
      overflow-y: auto;
      flex: 1;
    }
    .conversation {
      padding: 10px;
      border-radius: 10px;
      border: 1px solid transparent;
      color: var(--text);
      cursor: pointer;
      transition: background 0.12s ease, border 0.12s ease;
      position: relative;
    }
    .conversation:hover {
      background: var(--panel);
      border-color: var(--border);
    }
    .conversation.active {
      border-color: rgba(108, 240, 194, 0.7);
      background: rgba(108, 240, 194, 0.08);
    }
    .conversation .title {
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 6px;
    }
    .conversation .meta {
      font-size: 12px;
      color: var(--muted);
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .sidebar-foot {
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px dashed var(--border);
      color: var(--muted);
      font-size: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: rgba(255, 255, 255, 0.02);
    }
    .sidebar-foot strong { color: var(--text); }
    .chat-shell {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.04) 0%, rgba(255, 255, 255, 0.01) 100%);
      border: 1px solid var(--border);
      border-radius: 16px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: 18px;
      gap: 12px;
      box-shadow: var(--shadow);
      min-height: 0;
    }
    .chat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
    }
    .chat-title { font-size: 18px; font-weight: 600; }
    .chat-subtitle { color: var(--muted); font-size: 13px; }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--text);
      font-weight: 500;
      background: rgba(255, 255, 255, 0.03);
    }
    .pill .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 6px rgba(108, 240, 194, 0.2);
    }
    .message-area {
      overflow-y: auto;
      padding-right: 4px;
      scroll-behavior: smooth;
    }
    .message {
      margin-bottom: 12px;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.03);
      max-width: 780px;
      display: flex;
      gap: 10px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.14);
    }
    .message.user {
      margin-left: auto;
      background: rgba(108, 240, 194, 0.08);
      border-color: rgba(108, 240, 194, 0.5);
    }
    .message.assistant {
      background: rgba(255, 255, 255, 0.02);
    }
    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      background: linear-gradient(135deg, rgba(108, 240, 194, 0.25), rgba(93, 216, 255, 0.25));
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: var(--text);
      flex-shrink: 0;
    }
    .message.user .avatar {
      background: linear-gradient(135deg, rgba(108, 240, 194, 0.8), rgba(93, 216, 255, 0.6));
      color: #052018;
      border: none;
    }
    .message-content {
      white-space: pre-wrap;
      color: var(--text);
      font-size: 15px;
      line-height: 1.5;
    }
    .message-meta {
      color: var(--muted);
      font-size: 12px;
      margin-top: 6px;
    }
    .composer {
      display: grid;
      gap: 10px;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.03);
      position: sticky;
      bottom: 0;
    }
    textarea {
      width: 100%;
      resize: none;
      min-height: 60px;
      max-height: 200px;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(8, 13, 26, 0.7);
      color: var(--text);
      font-family: "Inter", system-ui, sans-serif;
      font-size: 15px;
      outline: none;
      transition: border 0.12s ease;
    }
    textarea:focus { border-color: rgba(108, 240, 194, 0.7); }
    .composer-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .hint { color: var(--muted); font-size: 12px; }
    .send {
      background: linear-gradient(135deg, var(--accent), var(--accent-soft));
      color: #051018;
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: var(--glow);
      transition: transform 0.12s ease;
    }
    .send:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .send:hover:not(:disabled) { transform: translateY(-1px); }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px;
      border-radius: 12px;
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 12px;
      background: rgba(255, 255, 255, 0.02);
    }
    @media (max-width: 960px) {
      .page { grid-template-columns: 1fr; padding: 12px; }
      .sidebar { order: 2; }
      .chat-shell { order: 1; }
    }
  </style>
</head>
<body>
  <div class="page">
    <aside class="sidebar">
      <div class="brand">
        <div class="pulse"></div>
        <div>MCP Local LLM</div>
      </div>
      <button class="action" id="newChat">New chat</button>
      <div class="sidebar-section">
        <div class="sidebar-label">Conversations</div>
        <div id="conversationList"></div>
      </div>
      <div class="sidebar-foot">
        <div><strong>Backend:</strong> <span id="backendUrl">http://localhost:8000</span></div>
        <div id="connectionNote">Checking MCP server...</div>
      </div>
    </aside>

    <main class="chat-shell">
      <header class="chat-header">
        <div>
          <div class="chat-title">Chat workspace</div>
          <div class="chat-subtitle">Ask anything and the MCP server will respond.</div>
        </div>
        <div class="pill" id="statusPill"><span class="dot"></span><span id="statusText">Checking...</span></div>
      </header>

      <section class="message-area" id="messages"></section>

      <form class="composer" id="composer">
        <textarea id="promptInput" placeholder="Send a message" rows="1"></textarea>
        <div class="composer-actions">
          <div class="hint">Enter to send - Shift+Enter for a newline</div>
          <button class="send" id="sendBtn" type="submit">
            <span>Send</span>
            <span aria-hidden="true">></span>
          </button>
        </div>
      </form>
    </main>
  </div>

  <script>
    const BACKEND_BASE = (() => {
      const loc = window.location;
      return loc.protocol + "//" + loc.hostname + ":8000";
    })();
    const PROMPT_ENDPOINT = BACKEND_BASE + "/prompt";
    const STORAGE_KEY = "mcp-chat-sessions";
    const conversationList = document.getElementById("conversationList");
    const messagesEl = document.getElementById("messages");
    const promptInput = document.getElementById("promptInput");
    const sendBtn = document.getElementById("sendBtn");
    const statusPill = document.getElementById("statusPill");
    const statusText = document.getElementById("statusText");
    const connectionNote = document.getElementById("connectionNote");
    const backendUrlEl = document.getElementById("backendUrl");

    let conversations = [];
    let currentId = null;
    let isSending = false;

    function uid() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ conversations, currentId }));
    }

    function loadState() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) {
        const id = createConversation("New chat");
        selectConversation(id);
        return;
      }
      try {
        const data = JSON.parse(raw);
        conversations = data.conversations || [];
        currentId = data.currentId || (conversations[0] && conversations[0].id);
        if (!conversations.length) {
          const id = createConversation("New chat");
          selectConversation(id);
        }
      } catch (_e) {
        const id = createConversation("New chat");
        selectConversation(id);
      }
    }

    function createConversation(title) {
      const id = uid();
      conversations.unshift({ id, title: title || "New chat", messages: [], createdAt: new Date().toISOString() });
      saveState();
      renderConversations();
      return id;
    }

    function selectConversation(id) {
      currentId = id;
      saveState();
      renderConversations();
      renderMessages();
    }

    function renderConversations() {
      conversationList.innerHTML = "";
      conversations.forEach((c) => {
        const el = document.createElement("div");
        el.className = "conversation" + (c.id === currentId ? " active" : "");
        el.innerHTML = '<div class="title">' + escapeHtml(c.title || "Conversation") + '</div><div class="meta">' + new Date(c.createdAt || Date.now()).toLocaleString() + "</div>";
        el.addEventListener("click", () => selectConversation(c.id));
        conversationList.appendChild(el);
      });
      if (!conversations.length) {
        const id = createConversation("New chat");
        selectConversation(id);
      }
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function renderMessages() {
      const convo = conversations.find((c) => c.id === currentId);
      messagesEl.innerHTML = "";
      if (!convo || !convo.messages.length) {
        const empty = document.createElement("div");
        empty.className = "badge";
        empty.textContent = "Start a new conversation with a prompt.";
        messagesEl.appendChild(empty);
        return;
      }
      convo.messages.forEach((msg) => {
        const wrapper = document.createElement("div");
        wrapper.className = "message " + msg.role;
        const avatar = document.createElement("div");
        avatar.className = "avatar";
        avatar.textContent = msg.role === "assistant" ? "AI" : "You";
        const body = document.createElement("div");
        body.className = "message-body";
        const content = document.createElement("div");
        content.className = "message-content";
        content.innerHTML = formatContent(msg.content);
        const meta = document.createElement("div");
        meta.className = "message-meta";
        meta.textContent = new Date(msg.createdAt).toLocaleTimeString();
        body.appendChild(content);
        body.appendChild(meta);
        wrapper.appendChild(avatar);
        wrapper.appendChild(body);
        messagesEl.appendChild(wrapper);
      });
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function formatContent(text) {
      return escapeHtml(text).replace(/\n/g, "<br>");
    }

    function addMessage(role, content) {
      const convo = conversations.find((c) => c.id === currentId);
      if (!convo) return null;
      const message = { id: uid(), role, content, createdAt: new Date().toISOString() };
      convo.messages.push(message);
      if (role === "user" && convo.messages.length === 1) {
        convo.title = content.slice(0, 48) + (content.length > 48 ? "..." : "");
      }
      saveState();
      renderMessages();
      renderConversations();
      return message.id;
    }

    function updateMessageContent(messageId, newContent) {
      const convo = conversations.find((c) => c.id === currentId);
      if (!convo) return;
      const message = convo.messages.find((m) => m.id === messageId);
      if (message) {
        message.content = newContent;
        saveState();
        renderMessages();
      }
    }

    async function sendPrompt(event) {
      event && event.preventDefault();
      if (isSending) return;
      const text = promptInput.value.trim();
      if (!text) return;
      promptInput.value = "";
      isSending = true;
      sendBtn.disabled = true;

      addMessage("user", text);
      const placeholderId = addMessage("assistant", "Thinking...");

      try {
        const res = await fetch(PROMPT_ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt: text })
        });
        if (!res.ok) {
          throw new Error("Server returned " + res.status);
        }
        const data = await res.json();
        const reply = data.response || JSON.stringify(data);
        updateMessageContent(placeholderId, reply);
      } catch (err) {
        updateMessageContent(placeholderId, "Error contacting MCP server: " + err.message);
      } finally {
        isSending = false;
        sendBtn.disabled = false;
        promptInput.focus();
      }
    }

    async function checkBackend() {
      try {
        const res = await fetch(BACKEND_BASE + "/");
        if (!res.ok) throw new Error("Status " + res.status);
        statusText.textContent = "MCP server online";
        statusPill.querySelector(".dot").style.background = "var(--accent)";
        connectionNote.textContent = "Ready to chat.";
      } catch (_e) {
        statusText.textContent = "MCP server unreachable";
        statusPill.querySelector(".dot").style.background = "#f78da7";
        connectionNote.textContent = "Start backend at " + BACKEND_BASE;
      }
    }

    function resizeTextarea() {
      promptInput.style.height = "auto";
      promptInput.style.height = Math.min(promptInput.scrollHeight, 200) + "px";
    }

    document.getElementById("newChat").addEventListener("click", () => {
      const id = createConversation("New chat");
      selectConversation(id);
      promptInput.focus();
    });

    document.getElementById("composer").addEventListener("submit", sendPrompt);
    promptInput.addEventListener("input", resizeTextarea);
    promptInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendPrompt();
      }
    });

    backendUrlEl.textContent = BACKEND_BASE;
    loadState();
    renderConversations();
    renderMessages();
    checkBackend();
    setInterval(checkBackend, 10000);
  </script>
</body>
</html>
