<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MCP Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.4/dist/purify.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css">
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/common.min.js"></script>
  <style>
    :root {
      --bg: #f7f7f8;
      --panel: #ffffff;
      --sidebar: #f7f7f8;
      --panel-soft: #f1f5f9;
      --border: #e5e7eb;
      --text: #111827;
      --muted: #6b7280;
      --accent: #10a37f;
      --accent-strong: #0e8a6a;
      --shadow: 0 8px 30px rgba(17, 24, 39, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", "Helvetica Neue", Arial, sans-serif;
    }
    .page {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 16px;
      padding: 16px;
      height: 100vh;
    }
    .sidebar {
      background: var(--sidebar);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      letter-spacing: 0.2px;
    }
    .brand .logo-dot {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: #111827;
      display: grid;
      place-items: center;
      color: #10a37f;
      font-weight: 700;
      font-size: 14px;
    }
    .action {
      background: var(--panel);
      border: 1px solid var(--border);
      padding: 10px 12px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: border-color 0.12s ease, box-shadow 0.12s ease;
    }
    .action:hover { border-color: #d1d5db; box-shadow: 0 4px 14px rgba(17, 24, 39, 0.06); }
    .sidebar-section { display: flex; flex-direction: column; gap: 8px; flex: 1; min-height: 0; }
    .sidebar-label { font-size: 12px; text-transform: uppercase; color: var(--muted); letter-spacing: 0.6px; }
    #conversationList {
      flex: 1;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--panel);
      padding: 6px;
    }
    .conversation {
      padding: 10px;
      border-radius: 8px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: background 0.12s ease, border-color 0.12s ease;
    }
    .conversation:hover { background: var(--panel-soft); border-color: var(--border); }
    .conversation.active {
      background: #e5f4ef;
      border-color: var(--accent);
    }
    .conversation .title { font-weight: 600; font-size: 14px; }
    .conversation .meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .sidebar-foot {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      background: var(--panel);
      color: var(--muted);
      font-size: 13px;
      display: grid;
      gap: 6px;
    }
    .chat-shell {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      box-shadow: var(--shadow);
      min-height: 0;
    }
    .chat-header {
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .chat-title { font-size: 20px; font-weight: 700; }
    .chat-subtitle { color: var(--muted); font-size: 14px; margin-top: 4px; }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--panel-soft);
      color: var(--text);
      font-weight: 600;
      font-size: 13px;
    }
    .pill .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
    }
    .message-area {
      padding: 18px;
      overflow-y: auto;
      background: var(--bg);
    }
    .message {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 12px;
      margin-bottom: 12px;
      max-width: 960px;
    }
    .message.assistant { background: var(--panel-soft); }
    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: #111827;
      color: #ffffff;
      display: grid;
      place-items: center;
      font-weight: 700;
      letter-spacing: 0.3px;
      flex-shrink: 0;
    }
    .message.user .avatar {
      background: #10a37f;
    }
    .message-content {
      white-space: pre-wrap;
      color: var(--text);
      font-size: 15px;
      line-height: 1.6;
    }
    .message-meta { color: var(--muted); font-size: 12px; margin-top: 6px; }
    .composer {
      padding: 14px 18px;
      border-top: 1px solid var(--border);
      background: var(--panel);
      display: grid;
      gap: 10px;
      position: sticky;
      bottom: 0;
    }
    textarea {
      width: 100%;
      resize: none;
      min-height: 64px;
      max-height: 200px;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #d1d5db;
      background: #fff;
      color: var(--text);
      font-family: "Inter", "Helvetica Neue", Arial, sans-serif;
      font-size: 15px;
      outline: none;
      transition: border 0.12s ease, box-shadow 0.12s ease;
    }
    textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(16, 163, 127, 0.12); }
    .composer-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .hint { color: var(--muted); font-size: 12px; }
    .send {
      background: var(--accent);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 8px 20px rgba(16, 163, 127, 0.25);
      transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease;
    }
    .send:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 10px 24px rgba(16, 163, 127, 0.3); }
    .send:disabled { opacity: 0.6; cursor: not-allowed; box-shadow: none; }
    .badge {
      padding: 14px;
      border-radius: 12px;
      border: 1px dashed var(--border);
      background: var(--panel-soft);
      color: var(--muted);
      font-size: 14px;
      max-width: 640px;
    }
    pre {
      background: #0f172a;
      color: #e5e7eb;
      border-radius: 10px;
      padding: 12px;
      overflow: auto;
      border: 1px solid #1f2937;
      position: relative;
      font-size: 14px;
      line-height: 1.5;
    }
    pre code {
      background: transparent;
      color: inherit;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      display: block;
    }
    .code-box {
      position: relative;
    }
    .copy-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      border: 1px solid #d1d5db;
      background: #f9fafb;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 12px;
      cursor: pointer;
      color: #374151;
      transition: background 0.12s ease, border-color 0.12s ease;
    }
    .copy-btn:hover {
      background: #e5e7eb;
      border-color: #cbd5e1;
    }
    .copy-btn.copied {
      background: #10a37f;
      color: #fff;
      border-color: #0e8a6a;
    }
    @media (max-width: 960px) {
      .page { grid-template-columns: 1fr; height: auto; }
      .sidebar { order: 2; }
      .chat-shell { order: 1; min-height: 70vh; }
    }
  </style>
</head>
<body>
  <div class="page">
    <aside class="sidebar">
      <div class="brand">
        <div class="logo-dot">M</div>
        <div>
          <div>MCP Chat</div>
          <div style="font-size:12px; color: var(--muted); font-weight:500;">Local LLM</div>
        </div>
      </div>
      <button class="action" id="newChat">+ New chat</button>
      <div class="sidebar-section">
        <div class="sidebar-label">Conversations</div>
        <div id="conversationList"></div>
      </div>
      <div class="sidebar-foot">
        <div><strong>Backend:</strong> <span id="backendUrl">http://localhost:8000</span></div>
        <div id="connectionNote">Checking MCP server...</div>
      </div>
    </aside>

    <main class="chat-shell">
      <header class="chat-header">
        <div>
          <div class="chat-title">ChatGPT-style workspace</div>
          <div class="chat-subtitle">Type naturally or use commands like !search, !browse, !rag, !calendar, !read, !shell.</div>
        </div>
        <div class="pill" id="statusPill"><span class="dot"></span><span id="statusText">Checking...</span></div>
      </header>

      <section class="message-area" id="messages"></section>

      <form class="composer" id="composer">
        <textarea id="promptInput" placeholder="Message MCP..." rows="1"></textarea>
        <div class="composer-actions">
          <div class="hint">Enter to send • Shift+Enter for a newline</div>
          <button class="send" id="sendBtn" type="submit">
            <span>Send</span>
            <span aria-hidden="true">➤</span>
          </button>
        </div>
      </form>
    </main>
  </div>

  <script>
    // Point to the backend on the same host (port 8000) so the browser can reach it from localhost.
    const { protocol, hostname } = window.location;
    const BACKEND_BASE = `${protocol}//${hostname}:8000`;
    const PROMPT_ENDPOINT = BACKEND_BASE + "/prompt";
    const STORAGE_KEY = "mcp-chat-sessions";
    const conversationList = document.getElementById("conversationList");
    const messagesEl = document.getElementById("messages");
    const promptInput = document.getElementById("promptInput");
    const sendBtn = document.getElementById("sendBtn");
    const statusPill = document.getElementById("statusPill");
    const statusText = document.getElementById("statusText");
    const connectionNote = document.getElementById("connectionNote");
    const backendUrlEl = document.getElementById("backendUrl");

    let conversations = [];
    let currentId = null;
    let isSending = false;

    function uid() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ conversations, currentId }));
    }

    function loadState() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) {
        const id = createConversation("New chat");
        selectConversation(id);
        return;
      }
      try {
        const data = JSON.parse(raw);
        conversations = data.conversations || [];
        currentId = data.currentId || (conversations[0] && conversations[0].id);
        if (!conversations.length) {
          const id = createConversation("New chat");
          selectConversation(id);
        }
      } catch (_e) {
        const id = createConversation("New chat");
        selectConversation(id);
      }
    }

    function createConversation(title) {
      const id = uid();
      conversations.unshift({ id, title: title || "New chat", messages: [], createdAt: new Date().toISOString() });
      saveState();
      renderConversations();
      return id;
    }

    function selectConversation(id) {
      currentId = id;
      saveState();
      renderConversations();
      renderMessages();
    }

    function renderConversations() {
      conversationList.innerHTML = "";
      conversations.forEach((c) => {
        const el = document.createElement("div");
        el.className = "conversation" + (c.id === currentId ? " active" : "");
        el.innerHTML = '<div class="title">' + escapeHtml(c.title || "Conversation") + '</div><div class="meta">' + new Date(c.createdAt || Date.now()).toLocaleString() + "</div>";
        el.addEventListener("click", () => selectConversation(c.id));
        conversationList.appendChild(el);
      });
      if (!conversations.length) {
        const id = createConversation("New chat");
        selectConversation(id);
      }
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function renderMessages() {
      const convo = conversations.find((c) => c.id === currentId);
      messagesEl.innerHTML = "";
      if (!convo || !convo.messages.length) {
        const empty = document.createElement("div");
        empty.className = "badge";
        empty.textContent = "Start a new conversation, or try commands like !search <topic>, !browse <url>, !rag <question>, !calendar, !read <path>, !shell <cmd>.";
        messagesEl.appendChild(empty);
        return;
      }
      convo.messages.forEach((msg) => {
        const wrapper = document.createElement("div");
        wrapper.className = "message " + msg.role;
        const avatar = document.createElement("div");
        avatar.className = "avatar";
        avatar.textContent = msg.role === "assistant" ? "AI" : "You";
        const body = document.createElement("div");
        body.className = "message-body";
        const content = document.createElement("div");
        content.className = "message-content";
        content.innerHTML = formatContent(msg.content);
        const meta = document.createElement("div");
        meta.className = "message-meta";
        meta.textContent = new Date(msg.createdAt).toLocaleTimeString();
        body.appendChild(content);
        body.appendChild(meta);
        wrapper.appendChild(avatar);
        wrapper.appendChild(body);
        messagesEl.appendChild(wrapper);
      });
      messagesEl.scrollTop = messagesEl.scrollHeight;
      enhanceCodeBlocks(messagesEl);
    }

    function formatContent(text) {
      if (window.marked && window.DOMPurify) {
        marked.setOptions({
          highlight(code, lang) {
            if (window.hljs && lang && hljs.getLanguage(lang)) {
              return hljs.highlight(code, { language: lang }).value;
            }
            if (window.hljs) {
              return hljs.highlightAuto(code).value;
            }
            return escapeHtml(code);
          }
        });
        const html = marked.parse(text || "");
        return DOMPurify.sanitize(html);
      }
      return escapeHtml(text || "").replace(/\n/g, "<br>");
    }

    function enhanceCodeBlocks(root) {
      const codeBlocks = root.querySelectorAll("pre > code");
      codeBlocks.forEach((codeEl) => {
        const pre = codeEl.parentElement;
        if (!pre) return;
        if (!pre.classList.contains("code-box")) {
          pre.classList.add("code-box");
        }
        if (!pre.querySelector(".copy-btn")) {
          const btn = document.createElement("button");
          btn.className = "copy-btn";
          btn.type = "button";
          btn.textContent = "Copy";
          btn.addEventListener("click", () => {
            navigator.clipboard.writeText(codeEl.textContent || "").then(() => {
              btn.textContent = "Copied";
              btn.classList.add("copied");
              setTimeout(() => {
                btn.textContent = "Copy";
                btn.classList.remove("copied");
              }, 1200);
            }).catch(() => {
              btn.textContent = "Error";
              setTimeout(() => { btn.textContent = "Copy"; }, 1200);
            });
          });
          pre.appendChild(btn);
        }
      });
    }

    function addMessage(role, content) {
      const convo = conversations.find((c) => c.id === currentId);
      if (!convo) return null;
      const message = { id: uid(), role, content, createdAt: new Date().toISOString() };
      convo.messages.push(message);
      if (role === "user" && convo.messages.length === 1) {
        convo.title = content.slice(0, 48) + (content.length > 48 ? "..." : "");
      }
      saveState();
      renderMessages();
      renderConversations();
      return message.id;
    }

    function getHistoryMessages() {
      const convo = conversations.find((c) => c.id === currentId);
      if (!convo) return [];
      return (convo.messages || []).map(m => ({ role: m.role, content: m.content }));
    }

    function updateMessageContent(messageId, newContent) {
      const convo = conversations.find((c) => c.id === currentId);
      if (!convo) return;
      const message = convo.messages.find((m) => m.id === messageId);
      if (message) {
        message.content = newContent;
        saveState();
        renderMessages();
      }
    }

    async function sendPrompt(event) {
      event && event.preventDefault();
      if (isSending) return;
      const text = promptInput.value.trim();
      if (!text) return;
      promptInput.value = "";
      isSending = true;
      sendBtn.disabled = true;

      addMessage("user", text);
      const historyForSend = getHistoryMessages();
      const placeholderId = addMessage("assistant", "Thinking...");

      try {
        const res = await fetch(PROMPT_ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt: text, messages: historyForSend })
        });
        if (!res.ok) {
          throw new Error("Server returned " + res.status);
        }
        const data = await res.json();
        const reply = data.response || JSON.stringify(data);
        updateMessageContent(placeholderId, reply);
      } catch (err) {
        updateMessageContent(placeholderId, "Error contacting MCP server: " + err.message);
      } finally {
        isSending = false;
        sendBtn.disabled = false;
        promptInput.focus();
      }
    }

    async function checkBackend() {
      try {
        const res = await fetch(BACKEND_BASE + "/");
        if (!res.ok) throw new Error("Status " + res.status);
        statusText.textContent = "MCP server online";
        statusPill.querySelector(".dot").style.background = "var(--accent)";
        connectionNote.textContent = "Ready to chat.";
      } catch (_e) {
        statusText.textContent = "MCP server unreachable";
        statusPill.querySelector(".dot").style.background = "#ef4444";
        connectionNote.textContent = "Start backend at " + BACKEND_BASE;
      }
    }

    function resizeTextarea() {
      promptInput.style.height = "auto";
      promptInput.style.height = Math.min(promptInput.scrollHeight, 200) + "px";
    }

    document.getElementById("newChat").addEventListener("click", () => {
      const id = createConversation("New chat");
      selectConversation(id);
      promptInput.focus();
    });

    document.getElementById("composer").addEventListener("submit", sendPrompt);
    promptInput.addEventListener("input", resizeTextarea);
    promptInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendPrompt();
      }
    });

    backendUrlEl.textContent = BACKEND_BASE;
    loadState();
    renderConversations();
    renderMessages();
    checkBackend();
    setInterval(checkBackend, 10000);
  </script>
</body>
</html>
